server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React SPA: serve index.html for any path (client-side routing)
  location / {
    try_files $uri /index.html;
  }

  # Lightweight health endpoint
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
