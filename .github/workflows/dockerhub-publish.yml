name: Build & Push (Docker Hub) - Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/yashsingh2000/chess-frontend
  SHORT_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally for PRs (no push), scan step optional later
      - name: Build (PRs) - no push
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      # Login & Push on main
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (main)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}